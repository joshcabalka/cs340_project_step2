<!-- Service tickets page using this pattern: -->
 <!-- Title, browse table, add, update, delete, back to index nav -->
  <!-- Bind all fields and actions to the service_tickets table -->
   <!-- templates/rental_order_items.html -->
      <!-- CITATION: Original work by project team unless otherwise cited-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service Tickets</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="container">
    {% include "nav.html" %}
    <div class="panel">
      <a href="{{ url_for('render_index_page') }}">Back to Index</a>
      <h1>Service Tickets</h1>
    </div>

    <div class="panel">
      <h2>Browse</h2>
      <table>
        <tr>
          <th>service_ticket_id</th>
          <th>opened_by_employee_id</th>
          <th>status</th>
          <th>created_at</th>

        </tr>
        {% for row in rows %}
        <tr>
          <td>{{ row.service_ticket_id }}</td>
          <td>{{ row.opened_by_employee_id }}</td>
          <td>{{ row.status }}</td>
          <td>{{ row.created_at }}</td>
        </tr>
        {% endfor %}
      </table>
    </div>

    <div class="panel">
      <h2>Add</h2>
      <form method="post" action="/service_tickets/add">
        <div class="row">
          <label>opened_by_employee_id</label>
          <select name="opened_by_employee_id" required>
            <option value="">-- Select Employee --</option>
            {% for employee in employees %}
            <option value="{{ employee.employee_id }}">
              {{ employee.employee_id }} - {{ employee.first_name }} {{ employee.last_name }} ({{ employee.role }})
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="row">
          <label>status</label>
          <select name="status" required>
            <option value="">-- Select Status --</option>
            <option value="open">Open</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Completed</option>
            <option value="canceled">Canceled</option>
          </select>
        </div>
        <div class="row"><label>created_at</label><input type="datetime-local" name="created_at" required></div>
        <button type="submit">Add</button>
      </form>
    </div>

    <div class="panel">
      <h2>Update</h2>
      <form method="post" action="/service_tickets/update">
        <div class="row">
          <label>service_ticket_id</label>
          <select name="service_ticket_id" required>
            <option value="">-- Select Service Ticket --</option>
            {% for ticket in rows %}
            <option value="{{ ticket.service_ticket_id }}">
              Ticket {{ ticket.service_ticket_id }} - {{ ticket.status }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="row">
          <label>opened_by_employee_id</label>
          <select name="opened_by_employee_id" required>
            <option value="">-- Select Employee --</option>
            {% for employee in employees %}
            <option value="{{ employee.employee_id }}">
              {{ employee.employee_id }} - {{ employee.first_name }} {{ employee.last_name }} ({{ employee.role }})
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="row">
          <label>status</label>
          <select name="status" required>
            <option value="">-- Select Status --</option>
            <option value="open">Open</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="row"><label>created_at</label><input type="datetime-local" name="created_at" required></div>
        <button type="submit">Update</button>
      </form>
    </div>

    <div class="panel">
      <h2>Delete</h2>
      <form method="post" action="/service_tickets/delete">
        <div class="row">
          <label>service_ticket_id</label>
          <select name="service_ticket_id" required>
            <option value="">-- Select Service Ticket --</option>
            {% for ticket in rows %}
            <option value="{{ ticket.service_ticket_id }}">
              Ticket {{ ticket.service_ticket_id }} - {{ ticket.status }}
            </option>
            {% endfor %}
          </select>
        </div>
        <button type="submit">Delete</button>
      </form>
    </div>
  </div>
</body>
</html>
