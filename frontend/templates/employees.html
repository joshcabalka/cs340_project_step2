<!-- Employees page using this pattern: -->
<!-- Title, browse table, add, update, delete, and back to index nav -->
<!-- Bind all fields and actions to the employees table -->
<!-- templates/employees.html -->
<!-- CITATION: Original work by project team unless otherwise cited-->
<!-- Citation for use of AI tools:
     Date: 2026-03-12
     Prompts used to generate: Keep the existing update dropdown for employee_id, 
     but auto-populate the selected employee's current values in the update form before submission.
     AI Source URL: https://chatgpt.com/ -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employees</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="container">
    {% include "nav.html" %}
    <div class="panel">
      <a href="{{ url_for('render_index_page') }}">Back to Index</a>
      <h1>Employees</h1>
    </div>

    <div class="panel">
      <h2>Browse</h2>
      <table>
        <tr>
          <th>employee_id</th>
          <th>first_name</th>
          <th>last_name</th>
          <th>role</th>
          <th>is_active</th>
        </tr>
        {% for row in rows %}
        <tr>
          <td>{{ row.employee_id }}</td>
          <td>{{ row.first_name }}</td>
          <td>{{ row.last_name }}</td>
          <td>{{ row.role }}</td>
          <td>{{ row.is_active }}</td>
        </tr>
        {% endfor %}
      </table>
    </div>

    <div class="panel">
      <h2>Add</h2>
      <form method="post" action="/employees/add">
        <div class="row"><label>first_name</label><input name="first_name" required></div>
        <div class="row"><label>last_name</label><input name="last_name" required></div>
        <div class="row"><label>role</label><input name="role" required></div>
        <div class="row">
          <label>is_active</label>
          <select name="is_active" required>
            <option value="1">Active (1)</option>
            <option value="0">Inactive (0)</option>
          </select>
        </div>
        <button type="submit">Add</button>
      </form>
    </div>

    <div class="panel">
      <h2>Update</h2>
      <form method="post" action="/employees/update">
        <div class="row">
          <label>employee_id</label>
          <select name="employee_id" id="employee_id_select" required>
            <option value="">-- Select Employee --</option>
            {% for employee in rows %}
            <option
              value="{{ employee.employee_id }}"
              data-first-name="{{ employee.first_name }}"
              data-last-name="{{ employee.last_name }}"
              data-role="{{ employee.role }}"
              data-is-active="{{ employee.is_active }}"
            >
              {{ employee.employee_id }} - {{ employee.first_name }} {{ employee.last_name }} ({{ employee.role }})
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="row"><label>first_name</label><input id="employee_first_name" name="first_name" required></div>
        <div class="row"><label>last_name</label><input id="employee_last_name" name="last_name" required></div>
        <div class="row"><label>role</label><input id="employee_role" name="role" required></div>
        <div class="row">
          <label>is_active</label>
          <select id="employee_is_active" name="is_active" required>
            <option value="1">Active (1)</option>
            <option value="0">Inactive (0)</option>
          </select>
        </div>
        <button type="submit">Update</button>
      </form>
    </div>

    <div class="panel">
      <h2>Delete</h2>
      <form method="post" action="/employees/delete">
        <div class="row">
          <label>employee_id</label>
          <select name="employee_id" required>
            <option value="">-- Select Employee --</option>
            {% for employee in rows %}
            <option value="{{ employee.employee_id }}">
              {{ employee.employee_id }} - {{ employee.first_name }} {{ employee.last_name }} ({{ employee.role }})
            </option>
            {% endfor %}
          </select>
        </div>
        <button type="submit">Delete</button>
      </form>
    </div>
  </div>

  <script>
    const employeeSelect = document.getElementById("employee_id_select");

    employeeSelect.addEventListener("change", function () {
      const selected = this.options[this.selectedIndex];

      document.getElementById("employee_first_name").value = selected.dataset.firstName || "";
      document.getElementById("employee_last_name").value = selected.dataset.lastName || "";
      document.getElementById("employee_role").value = selected.dataset.role || "";
      document.getElementById("employee_is_active").value = selected.dataset.isActive || "1";
    });
  </script>
</body>
</html>
