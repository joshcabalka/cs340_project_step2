<!-- Customers page -->
 <!-- templates/customers.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="container">
    <div class="panel">
      <a href="{{ url_for('render_index_page') }}">Back to Index</a>
      <h1>Customers</h1>
    </div>

    <div class="panel">
      <h2>Browse</h2>
      <table>
        <tr>
          <th>customer_id</th>
          <th>first_name</th>
          <th>last_name</th>
          <th>email</th>
          <th>phone</th>
        </tr>
        {% for row in rows %}
        <tr>
          <td>{{ row.customer_id }}</td>
          <td>{{ row.first_name }}</td>
          <td>{{ row.last_name }}</td>
          <td>{{ row.email }}</td>
          <td>{{ row.phone }}</td>
        </tr>
        {% endfor %}
      </table>
    </div>

    <div class="panel">
      <h2>Add</h2>
      <form method="post" action="/customers/add">
        <div class="row"><label>first_name</label><input name="first_name" required></div>
        <div class="row"><label>last_name</label><input name="last_name" required></div>
        <div class="row"><label>email</label><input name="email"></div>
        <div class="row"><label>phone</label><input name="phone"></div>
        <button type="submit">Add</button>
      </form>
    </div>

    <div class="panel">
      <h2>Update</h2>
      <form method="post" action="/customers/update">
        <div class="row">
          <label>customer_id</label>
          <select name="customer_id" required>
            <option value="">-- Select Customer --</option>
              {% for customer in rows %}
            <option value="{{ customer.customer_id }}">
              {{ customer.customer_id }} - {{ customer.first_name }} {{ customer.last_name }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="row"><label>first_name</label><input name="first_name" required></div>
        <div class="row"><label>last_name</label><input name="last_name" required></div>
        <div class="row"><label>email</label><input name="email"></div>
        <div class="row"><label>phone</label><input name="phone"></div>
        <button type="submit">Update</button>
      </form>
    </div>

    <div class="panel">
      <h2>Delete</h2>
      <form method="post" action="/customers/delete">
        <div class="row">
          <label>customer_id</label>
          <select name="customer_id" required>
            <option value="">-- Select Customer --</option>
            {% for customer in rows %}
            <option value="{{ customer.customer_id }}">
              {{ customer.customer_id }} - {{ customer.first_name }} {{ customer.last_name }}
            </option>
            {% endfor %}
          </select>
        </div>
        <button type="submit">Delete</button>
      </form>
    </div>

  </div>
</body>
</html>
